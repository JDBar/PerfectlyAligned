<div class="player-names-area">
	<div class="player-count-controls">
		<label for="player-count">Number of Players:</label>
		<div class="player-count-buttons">
			<button id="decrease-player-count" class="count-button" type="button">
				-
			</button>
			<span id="player-count-display">3</span>
			<button id="increase-player-count" class="count-button" type="button">
				+
			</button>
		</div>
	</div>
	<div class="player-names-row" id="player-inputs-container">
		<!-- Player inputs will be dynamically generated here -->
	</div>
	<div class="error-message" id="players-error-message"></div>
</div>
