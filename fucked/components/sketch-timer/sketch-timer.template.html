<div class="timer-container">
	<div class="timer-display">
		<span id="timer-minutes">02</span>:<span id="timer-seconds">00</span>
	</div>

	<div class="timer-controls">
		<button id="start-timer-button" class="timer-button start-button">
			Start Timer
		</button>
		<button id="stop-timer-button" class="timer-button stop-button">
			Stop Timer
		</button>
		<button id="reset-timer-button" class="timer-button reset-button">
			Reset Timer
		</button>
	</div>
</div>
